[tox]
envlist = cleanup,py26,py27,py34,flake8,covreport

[testenv]
setenv =
    PYTHONDONTWRITEBYTECODE=1

deps =
    nose
    coverage
    mock

commands =
    coverage run -a --branch --source=clobberer.py {envbindir}/nosetests

[testenv:flake8]
deps = flake8
commands = flake8 --max-line-length=159 .

[testenv:covreport]
commands = coverage html -i

[testenv:cleanup]
commands = coverage erase
